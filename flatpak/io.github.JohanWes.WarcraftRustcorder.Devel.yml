app-id: io.github.JohanWes.WarcraftRustcorder.Devel
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: warcraft-rustcorder
separate-locales: false

finish-args:
  # Native Wayland display only; there is deliberately no X11 fallback.
  - --socket=wayland
  # Playback and recording audio use the sandbox PulseAudio/PipeWire bridge.
  - --socket=pulseaudio
  # Hardware decode/encode and rendering require DRM render nodes.
  - --device=dri
  # ksni registers only with the desktop's StatusNotifierWatcher.
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib64/pkgconfig
  - /share/aclocal
  - /share/doc
  - /share/man
  - /share/locale

modules:
  - modules/ffmpeg.yml

  - modules/gpu-screen-recorder.yml

  - modules/clapper.yml

  - name: warcraft-rustcorder
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/warcraft-rustcorder/cargo
        CARGO_PROFILE_RELEASE_LTO: fat
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    build-commands:
      - cargo --offline build --manifest-path native/Cargo.toml --release --features development
      - install -Dm755 native/target/release/warcraft-rustcorder /app/bin/warcraft-rustcorder
      - install -d /app/share/warcraft-rustcorder
      - glib-compile-resources --sourcedir=data --target=/app/share/warcraft-rustcorder/spells.gresource data/spells.gresource.xml
      - install -Dm644 data/io.github.JohanWes.WarcraftRustcorder.Devel.desktop /app/share/applications/io.github.JohanWes.WarcraftRustcorder.Devel.desktop
      - install -Dm644 data/io.github.JohanWes.WarcraftRustcorder.Devel.metainfo.xml /app/share/metainfo/io.github.JohanWes.WarcraftRustcorder.Devel.metainfo.xml
      - install -Dm644 data/icons/io.github.JohanWes.WarcraftRustcorder.Devel.svg /app/share/icons/hicolor/scalable/apps/io.github.JohanWes.WarcraftRustcorder.Devel.svg
      - install -Dm644 data/io.github.JohanWes.WarcraftRustcorder.Devel.gschema.xml /app/share/glib-2.0/schemas/io.github.JohanWes.WarcraftRustcorder.Devel.gschema.xml
      - glib-compile-schemas /app/share/glib-2.0/schemas
    sources:
      - type: dir
        path: ../native
        dest: native
        skip:
          - target
      - type: dir
        path: ../data
        dest: data
        skip:
          - screenshots
      - cargo-sources.json

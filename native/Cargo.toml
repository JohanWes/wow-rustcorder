# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "warcraft-rustcorder"
version = "1.0.15"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "warcraft-rustcorder"
path = "src/main.rs"

[dependencies]
clapper = { package = "clapper-player", version = "=0.10.1", features = ["v0_10"] }
clapper-gtk = { package = "clapper-player-gtk", version = "=0.10.1", features = ["v0_10"] }
gstreamer = "0.25"
gtk4 = { version = "0.11.4", features = ["v4_10"] }
libadwaita = { version = "0.9.2", features = ["v1_6"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
ksni = { version = "=0.3.6", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
development = []
